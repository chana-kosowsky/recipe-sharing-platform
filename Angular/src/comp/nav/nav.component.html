<nav class="nav">
  <div class="nav__inner">

    <!-- לוגו -->
    <div class="nav__brand">
      <a routerLink="/" class="nav__logo" (click)="closeMobileMenu()">
        TASTE<span class="nav__logo-dot">.</span>
      </a>
    </div>

    <!-- קישורי ניווט (דסקטופ + תפריט מובייל) -->
    <div class="nav__menu" [class.active]="isMobileMenuOpen">
      <ul class="nav__links">
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
             (click)="closeMobileMenu()" class="nav-link">דף הבית</a>
        </li>
        <li>
          <a routerLink="/recipes" routerLinkActive="active"
             (click)="closeMobileMenu()" class="nav-link">מתכונים</a>
        </li>
        <li>
          <a routerLink="/search" routerLinkActive="active"
             (click)="closeMobileMenu()" class="nav-link">חיפוש רכיבים</a>
        </li>

        <!-- קישורים למשתמשים מחוברים -->
        @if (isLoggedIn) {
          <li>
            <a routerLink="/profile" routerLinkActive="active"
               (click)="closeMobileMenu()" class="nav-link">הפרופיל שלי</a>
          </li>

          @if (isApprovedUploader) {
            <li>
              <a routerLink="/recipe/add" routerLinkActive="active"
                 (click)="closeMobileMenu()" class="nav-link nav-link--cta">
                <i class="fas fa-plus"></i> הוספת מתכון
              </a>
            </li>
          }
        }

        @if (isLoggedIn && isAdmin) {
          <li>
            <a routerLink="/admin" routerLinkActive="active"
               (click)="closeMobileMenu()" class="nav-link nav-link--admin">
              <i class="fas fa-shield-halved"></i> ניהול מערכת
            </a>
          </li>
        }
      </ul>
    </div>

    <!-- פעולות משתמש בצד שמאל -->
    <div class="nav__actions">
      @if (!isLoggedIn) {
        <a routerLink="/login" class="nav__login">התחברות</a>
        <a routerLink="/register" class="nav__register">הצטרפות</a>
      } @else {
        <div class="nav__user">
          <span class="nav__user-name">שלום, <strong>{{ currentUsername }}</strong></span>
          <button (click)="logout()" class="nav__logout">
            <i class="fas fa-arrow-right-from-bracket"></i><span>יציאה</span>
          </button>
        </div>
      }

      <!-- כפתור המבורגר (מובייל בלבד) -->
      <button class="nav__hamburger" (click)="toggleMobileMenu()" [class.is-active]="isMobileMenuOpen"
              aria-label="תפריט">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</nav>
